<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House of Meila • Ventes par personne</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <style>
      body { font-family: Inter, sans-serif; background: #f8f1f4; margin:0; color:#3d1033; }
      .wrap { max-width: 1100px; margin: 40px auto; padding: 24px; }
      .panel { background: rgba(255,255,255,0.9); border: 1px solid rgba(61,16,51,0.12); border-radius: 18px; padding: 20px; box-shadow: 0 14px 32px rgba(61,16,51,0.12); }
      h1 { margin: 0 0 18px; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
      input, button { border-radius: 12px; border: 1px solid rgba(61,16,51,0.16); padding: 10px 12px; font: inherit; }
      button { background: #3d1033; color: white; border: none; cursor:pointer; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px; border-bottom: 1px solid rgba(61,16,51,0.10); text-align: left; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>Ventes regroupées par personne</h1>
        <div class="controls">
          <input id="search" type="text" placeholder="Nom ou numéro du client" style="flex:1; min-width:220px;" />
          <button id="download">Télécharger Excel</button>
        </div>
        <div style="overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>Client</th>
                <th>Carte</th>
                <th>Nombre de ventes</th>
                <th>Total</th>
                <th>Réduction</th>
                <th>Dernière vente</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://zpwxoooqnxvxoahltjkh.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_amt16PERz3_dyckZWf3oUA_2SzshhGy';
      const supabaseClientFactory = window.supabase && typeof window.supabase.createClient === 'function'
        ? window.supabase.createClient
        : null;
      const supabaseClient = supabaseClientFactory ? supabaseClientFactory(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

      function formatCurrency(value) { const n = Number(value || 0); return `${n.toLocaleString('fr-FR')} HTG`; }

      function mapSaleRow(row) {
        if (!row) return null;
        return {
          customerId: row.customer_id || row.customerId || null,
          customerName: row.customer_name || row.customerName || '—',
          cardNumber: row.card_number || row.cardNumber || '—',
          total: Number(row.total || 0),
          discount: Number(row.discount || 0),
          timestamp: row.timestamp || row.created_at || new Date().toISOString()
        };
      }

      async function readSales() {
        if (!supabaseClient) return [];
        const { data, error } = await supabaseClient.from('sales').select('*').order('timestamp', { ascending: false });
        if (error) {
          console.error(error);
          return [];
        }
        return (data || []).map(mapSaleRow).filter(Boolean);
      }

      async function render() {
        const keyword = document.getElementById('search').value.trim().toLowerCase();
        const sales = await readSales();
        const map = new Map();

        sales.forEach((sale) => {
          const key = sale.customerId || sale.customerName;
          if (!map.has(key)) map.set(key, { customerName: sale.customerName || '—', cardNumber: sale.cardNumber || '—', count: 0, total: 0, discount: 0, last: sale.timestamp });
          const row = map.get(key);
          row.count += 1;
          row.total += Number(sale.total || 0);
          row.discount += Number(sale.discount || 0);
          row.last = sale.timestamp;
        });

        const list = [...map.values()].filter((row) => {
          if (!keyword) return true;
          return `${row.customerName}`.toLowerCase().includes(keyword) || `${row.cardNumber}`.toLowerCase().includes(keyword);
        });

        const rows = document.getElementById('rows');
        rows.innerHTML = list.length ? list.map((row) => `
          <tr>
            <td>${row.customerName}</td>
            <td>${row.cardNumber}</td>
            <td>${row.count}</td>
            <td>${formatCurrency(row.total)}</td>
            <td>${formatCurrency(row.discount)}</td>
            <td>${new Date(row.last).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td>
          </tr>
        `).join('') : '<tr><td colspan="6" style="padding:18px; text-align:center;">Aucune vente.</td></tr>';
      }

      document.getElementById('search').addEventListener('input', render);
      document.getElementById('download').addEventListener('click', async () => {
        const sales = await readSales();
        const list = [...new Map(sales.map((sale) => [sale.customerId || sale.customerName, { customer: sale.customerName, card: sale.cardNumber, total: sale.total, discount: sale.discount, date: sale.timestamp }])).values()];
        const lines = [['Client','Carte','Total','Réduction','Date'].join(',')];
        list.forEach((row) => lines.push([`"${row.customer}"`,`"${row.card}"`,row.total,row.discount,`"${new Date(row.date).toISOString()}"`].join(',')));
        const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'ventes-par-personne.csv'; a.click();
        URL.revokeObjectURL(url);
      });

      render();
    </script>
  </body>
</html>
